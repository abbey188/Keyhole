# fly.toml app configuration file generated for keyhole on 2026-11-14T16:42:01Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'keyhole'
primary_region = 'lhr'

[build]
[env]
  RS_PER_IP_PER_MINUTE = '3000'
  RS_SPONSOR_MAX = '40'
  RS_SPONSOR_NEAR = '1'

[[mounts]]
  source = 'keyhole_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
