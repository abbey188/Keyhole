[package]
name = "keyhole-contract"
description = "Keyhole box contract: NFT boxes, access grants, receipt chain, blobs, deals and escrow. No admin, no upgrade."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.29", default-features = false, features = ["unit-testing"] }
keyhole-proto = { path = "../../crates/keyhole-proto" }

[dev-dependencies]
near-sdk = { version = "5.29", features = ["unit-testing"] }
